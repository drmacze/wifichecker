name: Validate WiFi Checker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check motion.js
          node --check quality.js
          node --check sw.js
          node --input-type=module --check < workspace.js
          node --input-type=module --check < engine-v6.js
          node --input-type=module --check < meter-flow.js
          node --input-type=module --check < meter-performance.js
          node --input-type=module --check < engine-v6-ui.js
          node --input-type=module --check < intelligence.js
          node --input-type=module --check < accuracy.js
          node --input-type=module --check < advanced-diagnostics.js
          node --input-type=module --check < result-audit.js
          node --input-type=module --check < video-test.js
          node --input-type=module --check < video-resolution-lab.js
          node --input-type=module --check < video-modern-controller.js

      - name: Check referenced DOM IDs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          app = Path('app.js').read_text()
          ids = set(re.findall(r'id="([^"]+)"', html))
          used_app = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(used_app - ids)
          if missing:
              raise SystemExit('Missing app DOM IDs: ' + ', '.join(missing))
          print(f'OK: {len(used_app)} app engine IDs found in HTML')
          PY

      - name: Check Engine v6, continuous meter and verified resolution proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          motion=Path('motion.js').read_text(); motion_css=Path('motion.css').read_text(); engine=Path('engine-v6.js').read_text()
          flow=Path('meter-flow.js').read_text(); meter_perf=Path('meter-performance.js').read_text(); v6ui=Path('engine-v6-ui.js').read_text()
          accuracy=Path('accuracy.js').read_text(); advanced=Path('advanced-diagnostics.js').read_text(); audit=Path('result-audit.js').read_text(); audit_css=Path('result-audit.css').read_text()
          video=Path('video-test.js').read_text(); lab=Path('video-resolution-lab.js').read_text(); modern=Path('video-modern-controller.js').read_text(); video_css=Path('video-test.css').read_text(); modern_css=Path('video-modern.css').read_text(); proof_css=Path('video-resolution-proof.css').read_text(); sw=Path('sw.js').read_text()
          required_motion=["import('./engine-v6.js')",'wifiCheckerEngineV6','touchLike',"import('./meter-performance.js')", "import('./engine-v6-ui.js')", "import('./video-test.js')", "import('./video-resolution-lab.js').then(()=>import('./video-modern-controller.js'))"]
          required_css=["@import url('./result-audit.css')", "@import url('./video-test.css')", "@import url('./video-modern.css')", "@import url('./video-resolution-proof.css')"]
          required_engine=['version:6',"method:'performance-aware-saturation-http'",'performanceAwareConcurrency:true','saturationPlateauDetection:true','twoStageCalibration:true','uiFrameMonitoring:true','warmupCalibration:true','convergenceControl:true','confidenceRange:true','contentionHeuristics:true','runBurst','adaptiveStreams','plateauState','relativeCIWidth','frameStalls','nextFrame','runningMedian','wifi-measurement-audit']
          required_flow=['KALIBRASI','convergence','wifiMeasurementSession','flowGaugeValue','flowGaugeNeedle','requestAnimationFrame','runningMedian','liveEstimate','scaleLocked','displayMax','targetMax','continuousEstimator:true','usesRunningMedian:true','scaleInterpolation:true','finalResultUnsmoothened:true','smoothing hanya untuk tampilan live']
          required_lab=['sameSourceComparison:true','strictExactTrack:true','verifyDecodedResolution:true','detailZoom:true','chooseComparisonSource','chooseExactTrack','urlHeights','video.videoHeight','video.videoWidth','vrRequested','vrDecoded','vrSource','vrBitrate','vrTrack','Detail 4×','source track','stopImmediatePropagation','wifiVideoResolutionLab']
          required_meter_perf=['legacyBridgeIsolation:true','detachLegacyTarget','dialLabel','dialValue','meterBridge']
          required_v6ui=['ENGINE v6 PERFORMANCE','saturationPlateau','frameStalls','Profile','wifiEngineV6UI']
          required_accuracy=['resultWidth','integrityPenalty','contentionSuspected','ci90Low','accuracySource','Paket asli tetap hanya dapat dipastikan']
          required_audit=['RESULT AUDIT','LOCAL BASELINE','auditScore','relativeWidth','wifi-measurement-audit','Sebaiknya ulangi Full Test','contention/cross-traffic']
          required_audit_css=['.audit-grid','.audit-verdict','.baseline-grid']
          required_video=['Video Resolution Test','REAL STREAMING LAB','getVideoPlaybackQuality','Streaming Strength','RSSI/dBm']
          required_modern=['WING IT!','ee623d80-fd8d-4a2a-8aae-1f5acf796f27','webkitEnterFullscreen','requestFullscreen','videoFullscreenBtn','wifiVideoModern']
          required_proof_css=['.video-resolution-proof','.resolution-detail-zoom','DETAIL 4×']
          required_cache=['v25-resolution-proof','engine-v6.js','meter-flow.js','video-test.js','video-resolution-lab.js','video-resolution-proof.css','video-modern-controller.js']
          missing=([x for x in required_motion if x not in motion]+[x for x in required_css if x not in motion_css]+[x for x in required_engine if x not in engine]+[x for x in required_flow if x not in flow]+[x for x in required_lab if x not in lab]+[x for x in required_meter_perf if x not in meter_perf]+[x for x in required_v6ui if x not in v6ui]+[x for x in required_accuracy if x not in accuracy]+[x for x in required_audit if x not in audit]+[x for x in required_audit_css if x not in audit_css]+[x for x in required_video if x not in video]+[x for x in required_modern if x not in modern]+[x for x in required_proof_css if x not in proof_css]+[x for x in required_cache if x not in sw])
          if missing: raise SystemExit('Missing integration: '+', '.join(missing))
          if "import('./video-quality-lock.js')" in motion or 'video-quality-lock.js' in sw: raise SystemExit('Legacy video quality lock still active')
          if "import('./engine-v5.js')" in motion or 'engine-v5.js' in sw: raise SystemExit('Legacy Engine v5 still active')
          if "import('./engine-v4.js')" in motion or 'engine-v4.js' in sw: raise SystemExit('Legacy Engine v4 still active')
          if '@latest' in motion or '@latest' in video or '@latest' in modern or '@latest' in lab: raise SystemExit('Unpinned dependency detected')
          print('OK: Engine v6, continuous meter, same-film exact-track resolution proof, decoded pixel verification, detail zoom, and PWA v25 are wired')
          PY

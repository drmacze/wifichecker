name: Validate WiFi Checker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check motion.js
          node --check quality.js
          node --check sw.js
          node --input-type=module --check < workspace.js
          node --input-type=module --check < engine-v3.js
          node --input-type=module --check < meter-flow.js
          node --input-type=module --check < intelligence.js

      - name: Check referenced DOM IDs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          app = Path('app.js').read_text()
          ids = set(re.findall(r'id="([^"]+)"', html))
          used_app = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(used_app - ids)
          if missing:
              raise SystemExit('Missing app DOM IDs: ' + ', '.join(missing))
          print(f'OK: {len(used_app)} app engine IDs found in HTML')
          PY

      - name: Check semantic engine and visual system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          motion = Path('motion.js').read_text()
          motion_css = Path('motion.css').read_text()
          engine = Path('engine-v3.js').read_text()
          flow = Path('meter-flow.js').read_text()
          flow_css = Path('meter-flow.css').read_text()
          intel = Path('intelligence.js').read_text()
          intel_css = Path('intelligence.css').read_text()
          quality = Path('quality.js').read_text()
          quality_css = Path('quality.css').read_text()
          workspace = Path('workspace.js').read_text()
          css = Path('workspace.css').read_text()
          sw = Path('sw.js').read_text()
          required_motion = ['lenis@1.3.26', 'gsap@3.15.0', 'ScrollTrigger', "import('./engine-v3.js')", "import('./meter-flow.js')", "import('./quality.js')", "import('./intelligence.js')"]
          required_motion_css = ["@import url('./quality.css')", "@import url('./meter-flow.css')", "@import url('./intelligence.css')"]
          required_engine = ['wifiMeasurementSession', 'requestWithRetry', 'stability', 'confidence', 'successRate', 'targetSamples', 'hardCap', 'wifi-test-phase']
          required_flow = ['flowGaugeNeedle', 'flowGaugeProgress', 'requestAnimationFrame(frame)', 'phase-steps', 'phase-transition', 'TES SELESAI', 'semakin tinggi semakin baik', 'semakin rendah semakin baik']
          required_intel = ['measurement-proof', 'MEASUREMENT QUALITY', 'Gaming', 'Video Call', '4K Streaming', 'Request success', 'wifi-measurement-session', 'higherScore', 'lowerScore', 'profileState']
          required_intel_css = ['.measurement-proof', '.usecase-grid', '.measure-grid', '.trend-row']
          required_flow_css = ['.phase-steps', '.phase-transition', '.flow-gauge-progress']
          required_quality = ['speedLevel', 'pingLevel', 'jitterLevel', 'loadedLatencyLevel', 'setGaugeQuality', 'replaceGaugeGradient']
          required_quality_css = ['--q-green:#22c55e', '--q-yellow:#eab308', '--q-orange:#f97316', '--q-red:#ef4444', '.legend-rule']
          required_workspace = ['installGauge', 'gaugeNeedle', 'convertMbps', 'estimatePlan']
          required_css = ['.clean-gauge', '.gauge-progress', '.meter-readouts', '.provider-card', '--bg:#080808', ':root.light']
          required_cache = ['v13-semantic-visual', 'engine-v3.js', 'meter-flow.js', 'meter-flow.css', 'intelligence.js', 'intelligence.css', 'quality.css', 'quality.js', 'workspace.js']
          missing = ([x for x in required_motion if x not in motion] +
                     [x for x in required_motion_css if x not in motion_css] +
                     [x for x in required_engine if x not in engine] +
                     [x for x in required_flow if x not in flow] +
                     [x for x in required_intel if x not in intel] +
                     [x for x in required_intel_css if x not in intel_css] +
                     [x for x in required_flow_css if x not in flow_css] +
                     [x for x in required_quality if x not in quality] +
                     [x for x in required_quality_css if x not in quality_css] +
                     [x for x in required_workspace if x not in workspace] +
                     [x for x in required_css if x not in css] +
                     [x for x in required_cache if x not in sw])
          if missing:
              raise SystemExit('Missing integration: ' + ', '.join(missing))
          if "import('./engine-v2.js')" in motion or 'engine-v2.js' in sw:
              raise SystemExit('Legacy engine v2 still active')
          if '@latest' in motion or '@latest' in workspace:
              raise SystemExit('Unpinned dependency detected')
          print('OK: semantic speed/latency logic, weighted profile scoring, monochrome visual system, smooth gauge, and v13 PWA cache are wired')
          PY

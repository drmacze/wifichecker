name: Validate WiFi Checker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check motion.js
          node --check sw.js
          node --input-type=module --check < workspace.js

      - name: Check referenced DOM IDs
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text()
          app = Path('app.js').read_text()
          ids = set(re.findall(r'id="([^"]+)"', html))
          used_app = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(used_app - ids)
          if missing:
              raise SystemExit('Missing app DOM IDs: ' + ', '.join(missing))
          print(f'OK: {len(used_app)} app engine IDs found in HTML')
          PY

      - name: Check clean UI integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          motion = Path('motion.js').read_text()
          workspace = Path('workspace.js').read_text()
          css = Path('workspace.css').read_text()
          sw = Path('sw.js').read_text()
          required_html = ['motion.css', 'motion.js', 'workspace.css', 'workspace.js', 'lucide@1.33.0']
          required_motion = ['lenis@1.3.26', 'gsap@3.15.0', 'ScrollTrigger']
          required_workspace = ['gsap@3.15.0', 'installGauge', 'gaugeNeedle', 'convertMbps', 'estimatePlan', 'providerProfile', 'meterGoBtn']
          required_css = ['.clean-gauge', '.gauge-progress', '.meter-readouts', '.provider-card', '.detail-toggle']
          required_cache = ['workspace.css', 'workspace.js']
          missing = ([x for x in required_html if x not in html] +
                     [x for x in required_motion if x not in motion] +
                     [x for x in required_workspace if x not in workspace] +
                     [x for x in required_css if x not in css] +
                     [x for x in required_cache if x not in sw])
          if missing:
              raise SystemExit('Missing integration: ' + ', '.join(missing))
          if '@latest' in html or '@latest' in motion or '@latest' in workspace:
              raise SystemExit('Unpinned dependency detected')
          if "@import url('./speedtest.css')" in css:
              raise SystemExit('Legacy speedtest CSS still imported')
          print('OK: clean SVG gauge, simplified UI, ISP estimator, and PWA cache are wired')
          PY
